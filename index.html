<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>KangiAdminApp</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #unity-container {
        position: relative;
        background: #000;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        background: #000;
        display: block;
      }
      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        z-index: 10;
      }
      .spinner {
        border: 4px solid rgba(255, 255, 255, 0.1);
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border-left-color: #3b82f6;
        animation: spin 1s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      #unity-progress-bar-empty {
        width: 180px;
        height: 8px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        overflow: hidden;
        margin-top: 12px;
      }
      #unity-progress-bar-full {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #3b82f6, #60a5fa);
        border-radius: 4px;
        transition: width 0.2s ease;
      }
      #loading-text {
        font-size: 14px;
        letter-spacing: 0.5px;
        color: #9ca3af;
      }
      #unity-warning {
        position: absolute;
        left: 50%;
        top: 10px;
        transform: translate(-50%);
        background: #ef4444;
        color: #fff;
        padding: 10px 16px;
        border-radius: 6px;
        display: none;
        z-index: 999;
        font-size: 14px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div class="spinner"></div>
        <div id="loading-text">Loading application...</div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
    </div>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      // Portrait Aspect Ratio (e.g. 9:16)
      var targetAspect = 9 / 16;

      function resizeContainer() {
        var windowWidth = window.innerWidth;
        var windowHeight = window.innerHeight;
        var windowAspect = windowWidth / windowHeight;

        var width, height;

        if (windowAspect > targetAspect) {
          // Screen is wider than portrait aspect ratio (Desktop / Landscape)
          height = windowHeight;
          width = height * targetAspect;
        } else {
          // Screen is narrower (Mobile Portrait)
          width = windowWidth;
          height = width / targetAspect;
          if (height > windowHeight) {
            height = windowHeight;
            width = height * targetAspect;
          }
        }

        container.style.width = Math.floor(width) + "px";
        container.style.height = Math.floor(height) + "px";
        canvas.style.width = "100%";
        canvas.style.height = "100%";
      }

      window.addEventListener('resize', resizeContainer);
      resizeContainer();

      function unityShowBanner(msg, type) {
        function updateBannerState() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style.background = '#ef4444';
        else {
          if (type == 'warning') div.style.background = '#f59e0b';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerState();
          }, 5000);
        }
        updateBannerState();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Kangi.loader.js";
      var config = {
        dataUrl: buildUrl + "/Kangi.data",
        frameworkUrl: buildUrl + "/Kangi.framework.js",
        codeUrl: buildUrl + "/Kangi.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "KangiAdminApp",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }

      loadingBar.style.display = "flex";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = (100 * progress) + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
